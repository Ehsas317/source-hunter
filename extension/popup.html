<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Source Hunter</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 380px; margin: 0; padding: 14px;
         font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { font-size: 12px; opacity: .65; margin-bottom: 10px; }
  .verdict { display: inline-block; padding: 2px 10px; border-radius: 999px;
             font-size: 12px; font-weight: 700; }
  .traced { background: #dcfce7; color: #166534; }
  .changed_along_the_way { background: #fef3c7; color: #92400e; }
  .no_traceable_source { background: #fee2e2; color: #991b1b; }
  .step { border-left: 3px solid #94a3b8; padding: 6px 8px; margin: 6px 0; font-size: 12px; }
  .step.matches { border-color: #22c55e; }
  .step.changed { border-color: #f59e0b; }
  .step.not_found { border-color: #64748b; }
  .step.no_source { border-color: #ef4444; }
  .step a { color: #0ea5e9; text-decoration: none; word-break: break-all; }
  .quote { opacity: .75; margin-top: 2px; }
  .status { font-size: 12px; opacity: .7; }
  .err { color: #ef4444; font-size: 12px; }
  button { font: inherit; }
  .idle { opacity: .75; font-size: 13px; }
</style>
</head>
<body>
<h1>🐟 Source Hunter</h1>
<div class="sub">Highlight text on a page → click the trace button. TinyFish traces it.</div>
<div id="status" class="status">idle</div>
<div id="body"></div>
<script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Source Hunter settings</title>
<style>
  body { max-width: 520px; margin: 40px auto; font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; padding: 0 16px; }
  input { width: 100%; font: 13px monospace; padding: 8px; box-sizing: border-box; }
  button { margin-top: 10px; font: inherit; padding: 8px 16px; }
  .hint { font-size: 12px; opacity: .7; }
</style></head>
<body>
<h1>Source Hunter settings</h1>
<p class="hint">Your TinyFish API key is stored only in this browser (chrome.storage.sync). Get one free at
<a href="https://agent.tinyfish.ai/api-keys" target="_blank">agent.tinyfish.ai/api-keys</a>.
Search and Fetch are free; Research deep runs are metered.</p>
<label for="key">TinyFish API key</label>
<input id="key" type="password" placeholder="sk-tinyfish-...">
<button id="save">Save</button>
<span id="saved" class="hint"></span>
<script src="options.js"></script>
</body>
</html>
